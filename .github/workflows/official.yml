# Legacy static-Qt4 packaging pipeline.
#
# This builds the historical "official" binaries: Qt is compiled from the
# pinned 4.8.7 submodule in this repository and linked statically, then
# packaged by wkhtmltopdf/packaging.
#
# It is kept for reference and for people who need bit-identical 0.12.6-style
# static builds. It is NOT the supported path any more, for two reasons:
#
#   1. Every runner referenced below (ubuntu-20.04, macos-10.15, windows-2019)
#      has been removed from GitHub Actions, so this workflow can no longer run
#      unattended.
#   2. Statically linking a 2013 Qt against a current libc is what makes the
#      released binaries stop working on new operating systems.
#
# The supported path is dynamic builds against the distribution's own Qt 5 +
# QtWebKit; see build.yml and docs/building.md.
#
# Trigger it manually if you specifically need the legacy static artifacts.
name: Official (legacy, manual only)
on:
  workflow_dispatch:

jobs:
  linux:
    name: Qt 4.8 on Linux
    runs-on: ubuntu-20.04
    steps:
      - name: checkout source
        uses: actions/checkout@v4
        with:
          path: wkhtmltopdf
          submodules: true
      - name: checkout packaging
        uses: actions/checkout@v4
        with:
          repository: wkhtmltopdf/packaging
          path: packaging
      - name: configure docker
        run:  |
          echo '{ "experimental": true }' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
      - name: build
        run: cd packaging && python3 ./build package-docker buster-amd64 ../wkhtmltopdf

  macos:
    name: Qt 4.8 on macOS
    runs-on: macos-10.15
    steps:
      - name: checkout source
        uses: actions/checkout@v4
        with:
          path: wkhtmltopdf
          submodules: true
      - name: checkout packaging
        uses: actions/checkout@v4
        with:
          repository: wkhtmltopdf/packaging
          path: packaging
      - name: setup build environment
        run: |
          brew install conan
          pip3 install pyyaml
          sudo gem install fpm --no-document
          sudo xcode-select --switch /Library/Developer/CommandLineTools
          sed -i -e 's/CFLAGS CXXFLAGS LDFLAGS/CFLAGS CXXFLAGS OBJECTIVE_CFLAGS LDFLAGS/g' wkhtmltopdf/qt/configure
          sed -i -e 's/compiler.version=9.0/compiler.version=12.0/g' packaging/.conan/profiles/macos-cocoa
      - name: build
        run: cd packaging && MACOSX_DEPLOYMENT_TARGET=10.7 python3 ./build vagrant macos-cocoa --clean --version - - ../wkhtmltopdf

  windows:
    name: Qt 4.8 on Windows
    runs-on: windows-2019
    steps:
      - name: checkout source
        uses: actions/checkout@v4
        with:
          path: wkhtmltopdf
          submodules: true
      - name: checkout packaging
        uses: actions/checkout@v4
        with:
          repository: wkhtmltopdf/packaging
          path: packaging
      - name: setup build environment
        run: |
          choco install -yr --no-progress vcbuildtools -ia "/Full"
          pip install -q conan
          cmd /c attrib "C:\Program Files (x86)\Windows Kits\10\include\wdf" +H
      - name: build
        run: cd packaging && python ./build vagrant msvc2015-win64 --clean --version - - ../wkhtmltopdf
