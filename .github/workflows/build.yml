name: Build

# wkhtmltopdf is built dynamically against the Qt 5 + QtWebKit provided by each
# distribution. That is deliberate: it is the only way to get coverage of new
# operating systems and architectures without shipping prebuilt binaries, and
# it means every distro/arch gets a binary built against its own libc, fontconfig
# and freetype. See docs/building.md.
#
# QtWebKit (WebKit 1) is only published for Linux, so this matrix is Linux-only
# by necessity -- see "Current direction" in docs/status.md for why macOS arm64
# and Windows ARM64 cannot be covered.

on:
  push:
    branches: [master, "modernize/**", "0.12.*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep rendering independent of the host's display server.
  QT_QPA_PLATFORM: offscreen
  # Debian/Ubuntu route qmake through qtchooser; ask for Qt 5 explicitly so we
  # never silently build against something else. Ignored elsewhere.
  QT_SELECT: qt5

jobs:
  # ---------------------------------------------------------------------------
  # Lint the workflow definitions themselves. A malformed workflow is rejected
  # by GitHub before any job is created, so the failure is a 0-second run with
  # no useful output in the job list -- easy to miss. This catches it instead.
  #
  # Only build.yml is checked. official.yml deliberately still references
  # runner labels that no longer exist, because it records the legacy static
  # pipeline as it actually was.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint workflow files
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Validate build.yml
        run: |
          set -eux
          curl -sSL -o actionlint.tgz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          tar xzf actionlint.tgz actionlint
          ./actionlint .github/workflows/build.yml

  # ---------------------------------------------------------------------------
  # Native runners: the primary gate. Covers both amd64 and arm64.
  # ---------------------------------------------------------------------------
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04 (amd64)
            runner: ubuntu-24.04
            apt: [qtbase5-dev, qtbase5-dev-tools, libqt5svg5-dev, libqt5xmlpatterns5-dev, libqt5webkit5-dev, libqt5printsupport5, build-essential, ca-certificates, fontconfig, fonts-dejavu-core, poppler-utils]
          - name: Ubuntu 24.04 (arm64)
            runner: ubuntu-24.04-arm
            apt: [qtbase5-dev, qtbase5-dev-tools, libqt5svg5-dev, libqt5xmlpatterns5-dev, libqt5webkit5-dev, libqt5printsupport5, build-essential, ca-certificates, fontconfig, fonts-dejavu-core, poppler-utils]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The pinned Qt 4.8.7 submodule is only needed for the legacy static
          # build; the dynamic build below must not depend on it.
          submodules: false

      - name: Install packages
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ join(matrix.apt, ' ') }}

      - name: Report environment
        run: |
          set -eu
          uname -m
          . /etc/os-release && echo "$PRETTY_NAME"

      - name: Locate Qt 5 qmake
        run: |
          set -eu
          # Distributions disagree about where the Qt 5 qmake lives: Debian
          # and Ubuntu route it through qtchooser, Fedora ships it under
          # /usr/lib/qt5/bin, and images where Qt 6 is the default may not put
          # Qt 5's on PATH at all. Resolve it explicitly rather than assuming
          # a bare `qmake` is Qt 5.
          for c in qmake qmake-qt5 /usr/lib/qt5/bin/qmake /usr/lib/qt5/bin/qmake-qt5; do
            if command -v "$c" >/dev/null 2>&1 && "$c" --version 2>&1 | grep -qE 'Qt version 5'; then
              echo "QMAKE=$c" >> "$GITHUB_ENV"
              "$c" --version
              exit 0
            fi
          done
          echo "::error::no Qt 5 qmake found"
          echo "PATH=$PATH"
          exit 1

      - name: Build
        run: |
          set -eux
          "$QMAKE" CONFIG+=release
          make -j"$(nproc)"

      - name: Smoke test
        run: ./tests/run-smoke-tests.sh ./bin

  # ---------------------------------------------------------------------------
  # Distribution matrix, in real containers, on amd64. This is what catches
  # "builds on Ubuntu, breaks on Fedora/openSUSE" -- library version skew,
  # stricter compilers, and musl.
  # ---------------------------------------------------------------------------
  distro:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Debian 12 (bookworm) is the last Debian release that still ships
          # QtWebKit 5.212. Debian 13 (trixie) dropped the source package
          # entirely, so "newest Debian" is not currently a target -- see
          # docs/status.md.
          - name: Debian 12 (bookworm, glibc 2.36)
            image: debian:bookworm
            manager: apt
            packages: [qtbase5-dev, qtbase5-dev-tools, libqt5svg5-dev, libqt5xmlpatterns5-dev, libqt5webkit5-dev, libqt5printsupport5, build-essential, ca-certificates, fontconfig, fonts-dejavu-core, poppler-utils]
          # QtPrintSupport ships inside qtbase on Fedora, so there is no
          # separate -printsupport-devel package to ask for.
          - name: Fedora 42
            image: fedora:42
            manager: dnf
            packages: [qt5-qtbase-devel, qt5-qtsvg-devel, qt5-qtxmlpatterns-devel, qt5-qtwebkit-devel, gcc-c++, make, ca-certificates, fontconfig, dejavu-sans-fonts, poppler-utils]
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install packages (Debian/Ubuntu)
        if: matrix.manager == 'apt'
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends ${{ join(matrix.packages, ' ') }}

      - name: Install packages (Fedora)
        if: matrix.manager == 'dnf'
        run: |
          set -eux
          dnf install -y ${{ join(matrix.packages, ' ') }}

      - name: Report environment
        run: |
          set -eu
          uname -m
          cat /etc/os-release

      - name: Locate Qt 5 qmake
        run: |
          set -eu
          # Distributions disagree about where the Qt 5 qmake lives: Debian
          # and Ubuntu route it through qtchooser, Fedora ships it under
          # /usr/lib/qt5/bin, and images where Qt 6 is the default may not put
          # Qt 5's on PATH at all. Resolve it explicitly rather than assuming
          # a bare `qmake` is Qt 5.
          for c in qmake qmake-qt5 /usr/lib/qt5/bin/qmake /usr/lib/qt5/bin/qmake-qt5; do
            if command -v "$c" >/dev/null 2>&1 && "$c" --version 2>&1 | grep -qE 'Qt version 5'; then
              echo "QMAKE=$c" >> "$GITHUB_ENV"
              "$c" --version
              exit 0
            fi
          done
          echo "::error::no Qt 5 qmake found"
          echo "PATH=$PATH"
          exit 1

      - name: Build
        run: |
          set -eux
          "$QMAKE" CONFIG+=release
          make -j"$(nproc)"

      - name: Smoke test
        run: ./tests/run-smoke-tests.sh ./bin

  # ---------------------------------------------------------------------------
  # musl / Alpine: NOT SUPPORTED, and deliberately not given a CI job.
  #
  # Alpine has never packaged QtWebKit -- there is no qt5-qtwebkit in v3.21 or
  # edge, in main or community -- so there is nothing to build against. This is
  # a change from what the old project claimed: the static "generic" Linux
  # build never worked on Alpine anyway, because it was linked against glibc
  # while Alpine uses musl.
  #
  # Supporting musl would mean building Qt 5 + QtWebKit 5.212 from source for
  # musl, which is a much larger job than anything else in this workflow.
  # Tracked in docs/status.md; do not add an Alpine job unless that has been
  # done first.
  # ---------------------------------------------------------------------------
  musl-unavailable:
    name: "musl/Alpine (unsupported - no QtWebKit package)"
    runs-on: ubuntu-24.04
    steps:
      - name: Confirm Alpine still has no QtWebKit
        run: |
          set -eu
          for repo in main community; do
            url="https://dl-cdn.alpinelinux.org/alpine/edge/$repo/x86_64/APKINDEX.tar.gz"
            if curl -sSL "$url" | tar xzO APKINDEX 2>/dev/null \
                 | grep -q '^P:qt5-qtwebkit'; then
              echo "::notice::Alpine now packages qt5-qtwebkit -- an Alpine build may be possible after all"
            else
              echo "confirmed: no qt5-qtwebkit in Alpine edge/$repo"
            fi
          done

  # ---------------------------------------------------------------------------
  # 32-bit ARM (Raspberry Pi 1/Zero/3-class and other armhf devices).
  #
  # Built inside an emulated armhf container rather than cross-compiled: a real
  # cross build needs a Qt cross mkspec (linux-g++-arm), which distributions do
  # not package, whereas qemu-user runs the distribution's own armhf qmake and
  # compiler unmodified. That is slower but it is the same build a real armhf
  # machine would perform.
  #
  # Deliberately non-blocking: emulated builds are slow and occasionally flaky,
  # and this should not be able to hold up the rest of the matrix. For real
  # armhf/RPi devices prefer the distribution package (Raspberry Pi OS is
  # Debian-based and ships wkhtmltopdf) over anything built here.
  # ---------------------------------------------------------------------------
  armhf:
    name: Debian 12 (armhf, 32-bit ARM) [emulated]
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          # "all" rather than "arm/v7": the narrower value did not reliably
          # register a binfmt handler on the runner, and the container then
          # died with "exec /usr/bin/bash: exec format error".
          platforms: all

      - name: Build and test in an armhf container
        run: |
          set -eux
          # bookworm, not trixie: trixie no longer ships QtWebKit at all.
          docker run --rm --platform linux/arm/v7 \
            -v "$PWD:/src" -w /src debian:bookworm bash -euxc '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                qtbase5-dev qtbase5-dev-tools \
                libqt5svg5-dev libqt5xmlpatterns5-dev \
                libqt5webkit5-dev libqt5printsupport5 \
                build-essential ca-certificates \
                fontconfig fonts-dejavu-core poppler-utils file
              uname -m
              qmake --version
              qmake CONFIG+=release
              make -j"$(nproc)"
              # Prove the emulated build really produced 32-bit ARM binaries.
              file bin/wkhtmltopdf bin/libwkhtmltox.so
              ./tests/run-smoke-tests.sh ./bin
            '

  # ---------------------------------------------------------------------------
  # Guard rail: a Qt 6 build must fail with our explanatory message rather than
  # a wall of qmake errors. Cheap, and it protects the common.pri guard.
  # ---------------------------------------------------------------------------
  qt6-guard:
    name: Qt 6 is rejected with a clear error
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Install Qt 6
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          # A compiler is required: without one qmake aborts with "Cannot run
          # compiler 'g++'" before it ever evaluates common.pri, and the guard
          # this job exists to test is never reached.
          apt-get install -y --no-install-recommends \
            build-essential qt6-base-dev qt6-tools-dev qt6-tools-dev-tools
      - name: Expect a helpful failure
        run: |
          set -eux
          # Evaluate a real sub-project directly. Running plain `qmake6` on the
          # top-level wkhtmltopdf.pro would not be enough: that file is
          # TEMPLATE=subdirs, so the sub-projects (and therefore common.pri,
          # which holds the guard) are only evaluated later, during `make`.
          if qmake6 -o /dev/null src/pdf/pdf.pro 2>err.log; then
            echo "::error::expected the Qt 6 build to be rejected, but it succeeded"
            exit 1
          fi
          if ! grep -q "requires QtWebKit" err.log; then
            echo "::error::build failed, but not with the expected QtWebKit message"
            cat err.log
            exit 1
          fi
          cat err.log
